# pipette.cfg — Unified configuration for ADP1000 and SP20 pipette devices
#
# Prerequisites:
#   1. RP2040 firmware compiled with DEVICE_ADP1000 or DEVICE_SP20 and
#      USB_PASSTHROUGH_ENABLED (see config.h)
#   2. Copy the following files to ~/klipper/klippy/extras/:
#        pipette_driver.py
#        adp1000_backend.py
#        sp20_backend.py
#        pipette_action.py
#   3. Include this file in printer.cfg:
#        [include pipette.cfg]

# ---------------------------------------------------------------------------
# [pipette] — protocol driver
# ---------------------------------------------------------------------------
[pipette]
# Switch device by changing this one line:
#   adp1000  — Modbus RTU, 115200 baud RS485
#   sp20     — KT_OEM binary frame, 38400 baud RS485
# The RP2040 firmware handles the RS485 baud rate; Klipper only sees USB CDC.
device_type: sp20

# USB CDC serial port of the RP2040
# On Linux use the stable by-id path:
serial: /dev/serial/by-id/usb-LDO_MOTORS_30333938340952D0-if00

# Device address (Modbus slave / KT_OEM addr)
device_addr: 1

# Single-request timeout in seconds (must exceed RP2040 RS485 round-trip)
response_timeout: 1.5

# Polling interval between attempts within a wait loop (seconds)
#poll_interval: 0.02

# Maximum time to wait for a device action (init / liquid detect) to complete
# SP20 homing can take 30~60 s depending on starting position; set generously.
action_timeout: 20.0

# USB-level retransmission count on timeout (0 = no retry, max 5)
#retry_count: 2

# Automatically home the device after Klipper connects (runs once per session)
#auto_init: False

# ---------------------------------------------------------------------------
# [pipette_action] — Z-axis TIP pickup and liquid probe
# ---------------------------------------------------------------------------
[pipette_action]
# Name of the [pipette] section above
pipette: pipette

# Z descent speed (mm/s)
probe_speed: 5.0

# Maximum Z travel during detection (mm); abort if not triggered within this distance
max_distance: 50.0

# TIP pickup: retract distance after TIP detected (mm).
# The final Z target is checked against Klipper's Z axis maximum.
tip_retract_dist: 50.0

# TIP pickup: extra downward travel after detection to ensure firm seating (mm)
# Set to 0 to retract immediately after trigger.
tip_extra_travel: 3

# Liquid probe: retract distance after liquid detected (mm).
# The final Z target is checked against Klipper's Z axis maximum.
liquid_retract_dist: 2.0

# Liquid probe: extra downward travel after liquid trigger (mm)
# Set to 0 to retract immediately after trigger.
liquid_extra_travel: 0.0

# Retract speed (mm/s)
retract_speed: 10.0

# Init command timeout when INIT=1 is used in PIPETTE_PICKUP_TIP / PIPETTE_LIQUID_PROBE
init_timeout: 10.0
# ADP1000 pressure detection mode for liquid probing (0~5, SP20 ignores this)
# 0=off, 1=pressure (default), 2=capacitive, 3=precision prep,
# 4=precision detect, 5=precision bubble-through
liquid_detect_mode: 1

# SP20 liquid-detection timeout (seconds); must exceed MAX_DIST/SPEED by 2 s.
probe_timeout: 15.0

# Maximum consecutive communication failures in register-polling mode.
# Not used for Z stopping when the corresponding physical pin is configured.
#max_comm_failures: 3

# Background device-status polling interval when no trigger pin is configured.
#endstop_poll_interval: 0.1

# Required for automatic TIP and liquid descents. Enter the lowest Z that is
# safe at both stations; commands refuse to descend until it is configured.
min_safe_z: 120

# ADS1220 abnormal-force stops apply only before the selected TIP/liquid signal.
# Each source has its own limit (absolute change from the moving baseline, g).
# Existing TIP traces show ~200 g sustained change before tip_pin triggers;
# 250 g is a provisional test limit above those normal runs. Existing liquid
# contact and no-contact traces did not trip the 5 g limit on offline replay.
# Reassess both limits after reviewing the protected collision-test CSV files.
# clear_time is measured from descent start; force is not checked while the
# moving baseline is learned. At 5 mm/s, 0.15 s spans 0.75 mm of descent.
# Too-short moves are rejected before moving.
pressure_guard_tip_force_g: 250.0
pressure_guard_tip_clear_time: 0.15
pressure_guard_liquid_force_g: 5.0
pressure_guard_liquid_clear_time: 0.15
# Maximum baseline drift compensation in grams per second (default 0).
# Only increase after observing a repeatable long-descent drift in traces.
#pressure_guard_drift_g_s: 0.0
# TIP extra_travel after a valid tip_pin trigger is outside this force guard.

# Optional hardware trigger pins (comment out to use register/sensor polling)
# Syntax follows Klipper endstop convention: ^ = pull-up, ! = invert polarity.
# Replace with actual unused pins on your MCU.
tip_pin: ^th:PB9
# Liquid detection is active-low on both ADP1000 and SP20.
# Use ^ pull-up only: physical LOW = Klipper TRIGGERED.
liquid_pin: ^th:PC13

# ---------------------------------------------------------------------------
# Quick-reference commands (paste into Klipper console to test):
# ---------------------------------------------------------------------------
# PIPETTE_INIT WAIT=1                 — home / initialize device
# PIPETTE_READ_TIP                    — read TIP sensor state
# PIPETTE_READ_LIQUID                 — read liquid state; AUTO uses liquid_pin when configured.
#                                      If level=LOW state=1(TRIGGERED), liquid is detected.
#                                      raw_endstop is only the underlying Klipper debug value.
# PIPETTE_READ_LIQUID SOURCE=PIN      — force liquid_pin reading (LOW => LIQUID DETECTED)
# PIPETTE_READ_LIQUID SOURCE=DEVICE   — force device register/status (SP20 Rr2 / ADP1000 0x0204)
# PIPETTE_UNLOAD_TIP WAIT=1           — device-level TIP unload/eject
# PIPETTE_ASPIRATE VOLUME=100 SPEED=200
# PIPETTE_DISPENSE VOLUME=100 SPEED=200 BACK=0
# PIPETTE_VOLUME_STATUS               — read used/available volume status
# PIPETTE_LIQUID_DETECT WAIT=1        — in-place liquid detection (no Z move).
#                                      WAIT=1 waits for device action completion.
# PIPETTE_START_LIQUID_DETECT         — start liquid sensing only (no Z move)
# PIPETTE_START_LIQUID_DETECT TIMEOUT=20
#                                      TIMEOUT is SP20 Ld timeout in seconds (clamped to 20s).
#                                      ADP1000 ignores TIMEOUT and uses MODE.
# PIPETTE_STOP_LIQUID_DETECT          — stop liquid sensing only (no Z move)
#
# PIPETTE_PICKUP_TIP                  — Z-axis TIP pickup. Uses tip_pin if configured,
#                                      otherwise polls device TIP status.
# PIPETTE_PICKUP_TIP INIT=1           — home first, then pick up TIP
# PIPETTE_PICKUP_TIP MAX_DIST=30 EXTRA_TRAVEL=0
# LOAD_TIP                            — load TIP at the fixed station
# UNLOAD_TIP                          — unload/eject TIP at the fixed station
#
# PIPETTE_LIQUID_PROBE                — Z-axis liquid probe. Uses liquid_pin if configured,
#                                      otherwise polls device liquid status.
#                                      With liquid_pin=^th:PC13, physical LOW = triggered
#                                      even when raw_endstop=0(OPEN).
# PIPETTE_LIQUID_PROBE MODE=2 SPEED=1.0
# PIPETTE_LIQUID_PROBE EXTRA_TRAVEL=2 RETRACT=2
#
# Pin state diagnostics (only when tip_pin / liquid_pin configured):
# PIPETTE_READ_TIP_PIN
# PIPETTE_READ_LIQUID_PIN             — read current pin level, normalized state, and raw_endstop
#                                      Example: level=LOW state=1(TRIGGERED) means detected.
# PIPETTE_PRESSURE_TEST DIST=0 HOLD=1 — stationary ADS1220 trace.
# PIPETTE_PRESSURE_TEST DIST=20 SPEED=5 SOURCE=TIP — bounded descent trace;
#                                      the selected pipette sensor still stops Z.
# # 1. Verify connection and initialize
# PIPETTE_INIT WAIT=1

# # 2. Check TIP sensor
# PIPETTE_READ_TIP

# # 3. In-place liquid detection (ADP1000 pressure mode 1; SP20 ignores MODE)
# PIPETTE_LIQUID_DETECT MODE=1 WAIT=1

# # 4. Z-axis TIP pickup (moves Z down until TIP detected)
# PIPETTE_PICKUP_TIP MAX_DIST=30

# # 5. Z-axis liquid probe (moves Z down until liquid detected)
# PIPETTE_LIQUID_PROBE SPEED=2.0 RETRACT=3.0


# PIPETTE_PRESSURE_TEST DIST=0 HOLD=1
# PIPETTE_PRESSURE_TEST DIST=20 SPEED=5 SOURCE=TIP
# PIPETTE_PRESSURE_TEST DIST=20 SPEED=5 SOURCE=LIQUID

# ---------------------------------------------------------------------------
# Tip station macros — load / unload pipette tip at the fixed station
# ---------------------------------------------------------------------------
# The next two macros are station movement helpers:
# UNLOAD_TIP ejects an installed TIP; LOAD_TIP installs a new TIP.


[gcode_macro LOAD_TIP]
description: Load a pipette tip at the tip station (requires TIP MISSING; FORCE=1 overrides)
gcode:
    {% set force = params.FORCE|default(0)|int %}
    PIPETTE_REQUIRE_TIP EXPECT=missing FORCE={force}
    _CLIENT_LINEAR_MOVE Z=155 F=1500 ABSOLUTE=1
    #_CLIENT_LINEAR_MOVE X=280.5 Y=359.5 F=18000 ABSOLUTE=1
    _CLIENT_LINEAR_MOVE X=278 Y=358 F=18000 ABSOLUTE=1
    G4 P500
    _CLIENT_LINEAR_MOVE Z=47 F=1500 ABSOLUTE=1
    G4 P1000
    _CLIENT_LINEAR_MOVE Y=340 F=6000 ABSOLUTE=1
    PROBE_ACCURACY SAMPLES=2 TRIGGER_FORCE=180
    _CLIENT_LINEAR_MOVE Z=155 F=1500  ABSOLUTE=1

[gcode_macro UNLOAD_TIP]
description: Unload the pipette tip at the tip station (requires TIP PRESENT; FORCE=1 overrides)
gcode:
    {% set force = params.FORCE|default(0)|int %}
    PIPETTE_REQUIRE_TIP EXPECT=present FORCE={force}
    _CLIENT_LINEAR_MOVE Z=155 F=1500 ABSOLUTE=1
    #_CLIENT_LINEAR_MOVE X=279.5 Y=343 F=18000 ABSOLUTE=1
    _CLIENT_LINEAR_MOVE X=278 Y=340 F=18000 ABSOLUTE=1
    G4 P500
    _CLIENT_LINEAR_MOVE Z=48 F=1500 ABSOLUTE=1
    G4 P1000
    _CLIENT_LINEAR_MOVE Y=358 F=6000 ABSOLUTE=1
    _CLIENT_LINEAR_MOVE Z=155 F=1500 ABSOLUTE=1





# ---------------------------------------------------------------------------
# Test-only macros — not built-in pipette commands
# ---------------------------------------------------------------------------
# The macros below are for manual TIP-station and XY/Z motion tests only.
# Adjust coordinates, speeds, and dwell time for the actual machine before use.

[gcode_macro TEST_TIP]
gcode:
    PIPETTE_PICKUP_TIP

[gcode_macro TEST_LIQUID]
gcode:
    PIPETTE_LIQUID_PROBE

[gcode_macro TEST_TIP_STATION_REPEAT]
description: Repeat test move: lift Z 25mm, move XY to tip station, move Z120, dwell, home XY
gcode:
    {% set count = params.COUNT|default(1)|int %}
    {% set dwell = params.DWELL|default(7)|float %}
    {% for i in range(count) %}
        G91
        _CLIENT_LINEAR_MOVE Z=25 F=1500 ABSOLUTE=0
        G90
        _CLIENT_LINEAR_MOVE X=279.5 Y=361.5 F=18000 ABSOLUTE=1
        _CLIENT_LINEAR_MOVE Z=120 F=1500 ABSOLUTE=1
        G4 P{(dwell * 1000)|int}
        G28 X Y
    {% endfor %}

[gcode_macro MOVE_TO_CENTER_Z200]
description: Move to XY center at Z200; override with X/Y/Z if needed
gcode:
    {% set min_x = printer.toolhead.axis_minimum.x|float %}
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set min_y = printer.toolhead.axis_minimum.y|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set x = params.X|default((min_x + max_x) / 2)|float %}
    {% set y = params.Y|default((min_y + max_y) / 2)|float %}
    {% set z = params.Z|default(200)|float %}
    _CLIENT_LINEAR_MOVE Z={z} F=1500 ABSOLUTE=1
    _CLIENT_LINEAR_MOVE X={x} Y={y} F=18000 ABSOLUTE=1



