# pipette.cfg — Unified configuration for ADP1000 and SP20 pipette devices
#
# Prerequisites:
#   1. RP2040 firmware compiled with DEVICE_ADP1000 or DEVICE_SP20 and
#      USB_PASSTHROUGH_ENABLED (see config.h)
#   2. Copy the following files to ~/klipper/klippy/extras/:
#        pipette_driver.py
#        adp1000_backend.py
#        sp20_backend.py
#        pipette_action.py
#   3. Include this file in printer.cfg:
#        [include pipette.cfg]

# ---------------------------------------------------------------------------
# [pipette] — protocol driver
# ---------------------------------------------------------------------------
[pipette]
# Switch device by changing this one line:
#   adp1000  — Modbus RTU, 115200 baud RS485
#   sp20     — KT_OEM binary frame, 38400 baud RS485
# The RP2040 firmware handles the RS485 baud rate; Klipper only sees USB CDC.
device_type: adp1000

# USB CDC serial port of the RP2040
# On Linux use the stable by-id path:
serial: /dev/serial/by-id/usb-LDO_MOTORS-if00

# Device address (Modbus slave / KT_OEM addr)
device_addr: 1

# Single-request timeout in seconds (must exceed RP2040 RS485 round-trip)
response_timeout: 1.5

# Polling interval between attempts within a wait loop (seconds)
#poll_interval: 0.02

# Maximum time to wait for a device action (init / liquid detect) to complete
#action_timeout: 15.0

# USB-level retransmission count on timeout (0 = no retry, max 5)
#retry_count: 2

# Automatically home the device after Klipper connects (runs once per session)
#auto_init: False

# ---------------------------------------------------------------------------
# [pipette_action] — Z-axis TIP pickup and liquid probe
# ---------------------------------------------------------------------------
[pipette_action]
# Name of the [pipette] section above
pipette: pipette

# Z descent speed (mm/s)
probe_speed: 5.0

# Maximum Z travel during detection (mm); abort if not triggered within this distance
max_distance: 50.0

# TIP pickup: retract distance after TIP detected (mm)
tip_retract_dist: 90.0

# TIP pickup: extra downward travel after detection to ensure firm seating (mm)
# Set to 0 to retract immediately after trigger.
tip_extra_travel: 3

# Liquid probe: retract distance after liquid detected (mm)
liquid_retract_dist: 2.0

# Retract speed (mm/s)
retract_speed: 10.0

# Init command timeout when INIT=1 is used in PIPETTE_PICKUP_TIP / PIPETTE_LIQUID_PROBE
init_timeout: 30.0

# ADP1000 pressure detection mode for liquid probing (0~5, SP20 ignores this)
# 0=off, 1=pressure (default), 2=capacitive, 3=precision prep,
# 4=precision detect, 5=precision bubble-through
liquid_detect_mode: 1

# Total timeout for the entire probing movement (seconds)
probe_timeout: 30.0

# Maximum consecutive communication failures before aborting Z movement
#max_comm_failures: 3

# Background polling interval during Z movement (seconds)
#endstop_poll_interval: 0.1

# Minimum safe Z position (mm); probe won't go below this. None = no limit.
#min_safe_z: 5.0

# Optional hardware trigger pins (comment out to use register/sensor polling)
# Syntax follows Klipper endstop convention: ^ = pull-up, ! = invert polarity.
# Replace with actual unused pins on your MCU.
tip_pin: ^th:PB9
#liquid_pin: ^th:PC13

# ---------------------------------------------------------------------------
# Quick-reference commands (paste into Klipper console to test):
# ---------------------------------------------------------------------------
# PIPETTE_INIT WAIT=1                 — home / initialize device
# PIPETTE_READ_TIP                    — read TIP sensor state
# PIPETTE_LIQUID_DETECT WAIT=1        — in-place liquid detection (no Z move)
#
# PIPETTE_PICKUP_TIP                  — Z-axis TIP pickup (register poll)
# PIPETTE_PICKUP_TIP INIT=1           — home first, then pick up TIP
# PIPETTE_PICKUP_TIP MAX_DIST=30 EXTRA_TRAVEL=0
#
# PIPETTE_LIQUID_PROBE                — Z-axis liquid probe (register poll)
# PIPETTE_LIQUID_PROBE MODE=2 SPEED=1.0
#
# Pin state diagnostics (only when tip_pin / liquid_pin configured):
# PIPETTE_READ_TIP_PIN
# PIPETTE_READ_LIQUID_PIN
